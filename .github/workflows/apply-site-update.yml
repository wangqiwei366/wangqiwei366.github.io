name: Apply site update

on:
  push:
    paths:
      - site-update.zip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand site files
        run: |
          unzip -o site-update.zip
          rm site-update.zip
          rm -f CNAME

      - name: Commit expanded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply KIMI Blog redesign"
            git push
          fi

<nav class="navbar navbar-default navbar-custom navbar-fixed-top{% if page.nav-style == 'invert' or page.header-style == 'text' %} invert{% endif %}" aria-label="主导航">
    <div class="nav-shell">
        <div class="navbar-header">
            <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
            <button type="button" class="navbar-toggle" aria-expanded="false" aria-controls="kimi-navbar" title="打开导航">
                <span class="sr-only">打开导航</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16" />
                </svg>
            </button>
        </div>

        <div id="kimi-navbar" class="navbar-links">
            <a href="{{ site.baseurl }}/#main-content"{% if page.url == '/' %} aria-current="page"{% endif %}>文章</a>
            <a href="{{ '/archive/' | prepend: site.baseurl }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>归档</a>
            <a href="{{ '/about/' | prepend: site.baseurl }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
            <button class="search-icon" type="button" title="搜索文章" aria-label="搜索文章">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5" />
                    <path d="m16 16 4 4" />
                </svg>
            </button>
        </div>
    </div>
</nav>

<script>
    (function () {
        var toggle = document.querySelector('.navbar-toggle');
        var links = document.querySelector('.navbar-links');
        if (!toggle || !links) return;

        function closeNavigation() {
            links.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('title', '打开导航');
        }

        toggle.addEventListener('click', function (event) {
            event.stopPropagation();
            var isOpen = links.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', String(isOpen));
            toggle.setAttribute('title', isOpen ? '关闭导航' : '打开导航');
        });

        document.addEventListener('click', function (event) {
            if (!links.contains(event.target)) closeNavigation();
        });
    })();
</script>
